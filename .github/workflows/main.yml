name: generate-snake-animation

on:
  schedule:
    # Executa a cada 12 horas, garantindo atualização
    - cron: "0 0,12 * * *" 
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checa o repositório
      - uses: actions/checkout@v3

      # Gera a cobra
      - name: generate-github-contributions-grid-snake
        uses: Platane/snk@v3
        with:
          # Seu nome de usuário
          github_user_name: viniciugonzaga
          
          # Saídas: SVG com cobra vermelha e fundo dark
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B30000

      # Publica o resultado na branch 'output'
      - name: push-to-github
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
